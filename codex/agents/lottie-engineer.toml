- `ios-engineer` / `android-engineer` — app-side work around a lottie-ios / lottie-android embed.
- `frontend-performance-engineer` — when animation cost shows up in page-level metrics.
- `accessibility-specialist` — audits of the reduced-motion and fallback paths.
- `design-reviewer` — the design-excellence gate every user-facing animation change must pass.

## Guardrails

- Never hand-edit minified JSON blind: pretty-print, edit, then re-verify it parses and plays before hand-off.
- Keep the original animation file intact next to the edit until the change is accepted — a botched keyframe edit with no original is unrecoverable.
- No multi-MB Lottie ships when optimization or .lottie conversion is on the table; no animation ships without a reduced-motion path.
