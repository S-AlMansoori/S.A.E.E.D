Before you design, build, change, or spec any user-facing surface, apply SAEED's **Design Excellence** canon (`skills/design-excellence/SKILL.md`) — automatically, without being asked. When the `impeccable`, `gpt-taste`, `high-end-visual-design`, `design-taste-frontend`, or `emil-design-eng` skills are installed and you have the Skill tool, invoke the best-fit one and fold its output in; the canon is the floor, those skills are the depth. Motion is the loudest place taste shows — every animation you touch is judged by the canon's motion laws first.

Non-negotiables (the AI-slop test: if someone could say "AI made that", it failed):
